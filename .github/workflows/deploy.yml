name: CI/CD - Go AppRunner

on:
    push:
        branches:
            - main
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-go@v4
              with:
                  go-version: 1.24

            - name: Rodar o fmt
              run: test -z "$(gofmt -l .)" || (echo "Código não formatado"; exit 1)

            - name: Go Vet
              run: go vet ./...

    tidy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-go@v4
              with:
                  go-version: 1.24
            - name: Verificar o gomod e gosum
              run: |
                  go mod tidy
                  git diff --exit-code || (echo "go.mod ou go.sum desatualizados"; exit 1)

    test:
        runs-on: ubuntu-latest
        needs: [lint, tidy]

        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-go@v4
              with:
                  go-version: 1.24
            - name: Rodar os testes
              run: go test ./...

    coverage:
        runs-on: ubuntu-latest
        needs: [lint, tidy, test]

        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-go@v4
              with:
                  go-version: 1.24
            - name: Gerar Covertura
              run: |
                  go test -coverprofile=coverage.out ./...
                  go tool cover -func=coverage.out
                  go tool cover -func=coverage.out | grep total | awk '{ print $$3 }' > coverage.txt

            - name: Validar Cobertura minima
              run: |
                  COV=$(cat coverage.txt | sed 's/%//')
                  MIN=0
                  echo "Cobertura: $$COV%"
                  if [ "$$COV" -lt "$$MIN"]; then
                    echo "Cobertura abaixo do minimo ($$MIN%)"
                    exit 1
                  fi

    deploy:
        runs-on: ubuntu-latest
        needs: [lint, tidy, test, coverage]
        if: github.ref == 'refs/heads/main'

        steps:
            - uses: actions/checkout@v3

            - name: Debug secrets
              run: |
                  echo "Checking if secrets are available..."
                  echo "AWS_ACCESS_KEY_ID length: ${#AWS_ACCESS_KEY_ID}"
                  echo "AWS_REGION value: '${{ secrets.AWS_REGION }}'"
                  echo "AWS_ACCOUNT_ID value: '${{ secrets.AWS_ACCOUNT_ID }}'"
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

            - name: Setup AWS environment
              run: |
                  echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
                  echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
                  echo "AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
                  echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV

            - name: Verify AWS credentials
              run: |
                  echo "Testing AWS CLI..."
                  aws sts get-caller-identity || echo "AWS CLI failed"

            - name: Create dynamic apprunner config
              run: |
                  cat > apprunner-config.json << EOF
                  {
                    "AuthenticationConfiguration": {
                      "AccessRoleArn": "${{ secrets.AWS_ACCESS_ROLE_ARN }}"
                    },
                    "ImageRepository": {
                      "ImageIdentifier": "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/gobid:latest",
                      "ImageRepositoryType": "ECR",
                      "ImageConfiguration": {
                        "Port": "3080",
                        "RuntimeEnvironmentVariables": {
                          "GOBID_APP_PORT": "3080",
                          "GOBID_DATABASE_PORT": "5432",
                          "GOBID_DATABASE_NAME": "gobid",
                          "GOBID_DATABASE_USER": "postgres",
                          "GOBID_DATABASE_PASSWORD": "${{ secrets.GOBID_DATABASE_PASSWORD }}",
                          "GOBID_DATABASE_HOST": "${{ secrets.GOBID_DATABASE_HOST }}",
                          "GOBID_CSRF_KEY": "${{ secrets.GOBID_CSRF_KEY }}",
                          "GOBID_JWT_SECRET": "${{ secrets.GOBID_JWT_SECRET }}"
                        }
                      }
                    },
                    "AutoDeploymentsEnabled": false
                  }
                  EOF

            - name: Create ECR repository
              run: make create-ecr
              env:
                  AWS_REGION: ${{ secrets.AWS_REGION }}
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  AWS_VPC_ID: ${{ secrets.AWS_VPC_ID }}
                  AWS_ACCESS_ROLE_ARN: ${{ secrets.AWS_ACCESS_ROLE_ARN }}
                  GOBID_DATABASE_PASSWORD: ${{ secrets.GOBID_DATABASE_PASSWORD }}

            - name: Build and push Docker image
              run: |
                  make build
                  make tag
                  make push
              env:
                  AWS_REGION: ${{ secrets.AWS_REGION }}
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  AWS_VPC_ID: ${{ secrets.AWS_VPC_ID }}
                  AWS_ACCESS_ROLE_ARN: ${{ secrets.AWS_ACCESS_ROLE_ARN }}
                  GOBID_DATABASE_PASSWORD: ${{ secrets.GOBID_DATABASE_PASSWORD }}

            - name: Deploy to AWS App Runner
              run: make deploy
              env:
                  AWS_REGION: ${{ secrets.AWS_REGION }}
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  AWS_VPC_ID: ${{ secrets.AWS_VPC_ID }}
                  AWS_ACCESS_ROLE_ARN: ${{ secrets.AWS_ACCESS_ROLE_ARN }}
                  GOBID_DATABASE_PASSWORD: ${{ secrets.GOBID_DATABASE_PASSWORD }}
